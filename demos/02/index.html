<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pocketlet - Solution & Value Prop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="phone-wrapper">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="app-header">
          <span class="logo">Pocketlet</span>
          <span class="badge">Testnet</span>
        </div>
        <div class="balance-card">
          <div class="label">Total Balance</div>
          <div class="amount">$1,250.00</div>
          <div class="asset">USDC</div>
        </div>
        <div class="actions">
          <div class="action">
            <div class="action-icon">↑</div>
            <span>Send</span>
          </div>
          <div class="action">
            <div class="action-icon">↓</div>
            <span>Receive</span>
          </div>
        </div>
      </div>
    </div>

    <div class="bullets">
      <div class="bullet" data-delay="1">
        <div class="bullet-dot"></div>
        <p><strong>Invisible crypto.</strong> No gas tokens, no seed phrases, no complexity.</p>
      </div>
      <div class="bullet" data-delay="2">
        <div class="bullet-dot"></div>
        <p><strong>Instant settlement.</strong> Powered by the Stellar blockchain under the hood.</p>
      </div>
      <div class="bullet" data-delay="3">
        <div class="bullet-dot"></div>
        <p><strong>Familiar feel.</strong> Looks and works like the money apps you already use.</p>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
