version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pocketlet-postgres
    environment:
      POSTGRES_USER: pocketlet
      POSTGRES_PASSWORD: pocketlet
      POSTGRES_DB: pocketlet
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pocketlet -d pocketlet']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
