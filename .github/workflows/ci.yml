name: CI

on:
  push:
    branches: [develop, stag-test, prod-test]
  pull_request:
    branches: [develop, stag-test, prod-test]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v28.0.0

      - name: Run tests
        run: cargo test

      - name: Build escrow contract
        run: stellar contract build

      - name: Verify WASM artifact
        run: test -f target/wasm32v1-none/release/pocketlet_escrow.wasm
        # Escrow contract deployment is handled by .github/workflows/cd.yml on the stag-test branch

  web:
    name: Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    # The Vitest setup (apps/web/vitest.setup.ts) applies migrations and truncates
    # tables on load, so the test step needs a real database, not a mock.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocketlet
          POSTGRES_PASSWORD: pocketlet
          POSTGRES_DB: pocketlet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketlet -d pocketlet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pocketlet:pocketlet@localhost:5432/pocketlet
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: cp .env.example .env.local

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        # Railway deployment is handled by .github/workflows/cd.yml on the stag-test (internal)
        # and prod-test (public) branches. Both target Stellar Testnet; mainnet is not supported.
        # See railway.json and Dockerfile for deployment configuration

